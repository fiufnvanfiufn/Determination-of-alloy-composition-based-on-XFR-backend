<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body class="mobile-body draft-body">
    <div class="draft-container">
        <!-- Блоки медиа -->
<!-- Блоки медиа (Отдельно от текста по заданию) -->
        <div style="display: flex; gap: 12px; margin-bottom: 5px;">

            <!-- Превью Видео -->
            <div class="draft-box" style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px;">
                <span style="font-size: 11px; color: #666; margin-bottom: 5px;"></span>
                {{ if .alloy.VideoURL }}
                    <video src="{{ .alloy.VideoURL }}" style="width: 100%; height: 110px; object-fit: cover; background: #000; border-radius: 4px;" controls muted></video>
                {{ else }}
                    <div style="width: 100%; height: 90px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #888;">Нет видео</div>
                {{ end }}
            </div>

            <!-- Превью Фото -->
            <div class="draft-box" style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px;">
                <span style="font-size: 11px; color: #666; margin-bottom: 5px;"></span>
                {{ if .alloy.ImageURL }}
                    <img src="{{ .alloy.ImageURL }}" alt="Превью" style="width: 100%; height: 110px; object-fit: cover; border-radius: 4px;">
                {{ else }}
                    <div style="width: 100%; height: 90px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #888;">Нет фото</div>
                {{ end }}
            </div>

        </div>

        <!-- Поля формы -->
        <input type="text" class="draft-input" placeholder="Название" value="{{ .alloy.Title }}">
        <input type="text" class="draft-input" placeholder="Первая высшая частота" value="{{ .alloy.EnergyKev }}">
        <input type="text" class="draft-input" placeholder="Вторая высшая частота" value="{{ .alloy.IntensityCps }}">

        <!-- ВРЕМЕННАЯ ЗАГЛУШКА: проверяем, не ломал ли сервер страницу на этом месте -->
        <textarea class="draft-input" placeholder="Описание сплава" rows="3">Описание</textarea>
    </div>

    <!-- Нижняя панель навигации -->
    <div class="tab-bar">
        <a href="/feed">Лента</a>
        <a href="/draft" class="active-tab">Добавление</a>
        <a href="/catalog">Каталог</a>
    </div>
</body>
</html>
