<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лента</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="mobile-body feed-body">
    <div class="feed-container">
        <!-- Область артефакта -->
        <div class="feed-media-wrapper">
            {{ if .alloy.VideoURL }}
                <video src="{{ .alloy.VideoURL }}" class="feed-media" autoplay muted loop playsinline preload="auto"></video>
            {{ else }}
                <video src="/media/default.mp4" class="feed-media" autoplay muted loop playsinline preload="auto"></video>
            {{ end }}
        </div>

        <!-- Нижняя строка: карточка слева и кнопки справа -->
        <div class="feed-bottom-row">
            <div class="feed-info-card">
                <div class="feed-title">{{ .alloy.Name }}</div>

                <div class="feed-energy-tag">
                    Высший пик: {{ .alloy.EnergyKev }} кэВ
                </div>
                <div class="feed-energy-tag">
                    Интенсивность: {{ .alloy.IntensityCps }} cps
                </div>

                <details class="feed-details">
                    <summary>еще</summary>
                    <div class="feed-details-content">
                        <p class="feed-description">{{ .alloy.Description }}</p>
                    </div>
                </details>
            </div>

            <div class="feed-actions">
                <div class="heart-block">
                    <div class="heart-circle">❤</div>
                    <span class="likes-count">{{ .alloy.LikesCount }}</span>
                </div>

<a href="/feed?alloy_id={{ .alloy.ID }}&next=true" class="next-circle-btn">➔</a>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <a href="/feed" class="active-tab">Лента</a>
        <a href="/draft">Добавление</a>
        <a href="/catalog">Каталог</a>
    </div>
</body>
</html>
