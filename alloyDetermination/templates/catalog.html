<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link rel="stylesheet" href="/static/styles/style.css">
</head>
<body class="mobile-body">
    <!-- Фильтрация слайдером (GET-запрос)[cite: 1] -->
    <form action="/catalog" method="GET" class="filter-slider-container">
        <div class="slider-header">
            <span class="slider-title">Выбранная энергия:</span>
            <!-- Показываем текущее выбранное число, отправленное на сервер -->
            <span class="slider-current-val">
                {{ if .query }}{{ .query }} кэВ{{ else }}0 кэВ (Все){{ end }}
            </span>
        </div>

        <!-- Ползунок без нижней разметки -->
        <input
            type="range"
            name="energy"
            min="0"
            max="25"
            step="0.01"
            value="{{ if .query }}{{ .query }}{{ else }}0{{ end }}"
            class="range-slider"
        >

        <!-- Оставлена только кнопка применения фильтра -->
        <div class="filter-actions">
            <button type="submit" class="filter-btn">Применить</button>
        </div>
    </form>

    <!-- Плитка карточек в 2 столбца -->
    <div class="grid">
        {{ range .alloys }}
        <div class="card">
            <a href="/feed?id={{ .Alloy.ID }}">
                <img src="{{ .Alloy.ImageURL }}" alt="{{ .Alloy.Title }}">
            </a>

            <!-- Новый блок с названием и частотой -->
            <div class="card-info">
                <a href="/feed?id={{ .Alloy.ID }}" class="card-title">
                    {{ .Alloy.Title }}
                </a>
                <div class="card-energy">
                    Частота: {{ .Alloy.EnergyKev }} кэВ
                </div>
            </div>

            <div class="card-footer">
                <div class="card-heart">
                    {{ .LikesCount }} 🤍
                </div>
            </div>
        </div>
        {{ end }}
    </div>

    <!-- Нижняя панель навигации -->
    <div class="tab-bar">
        <a href="/feed">Лента</a>
        <a href="/draft">Добавление</a>
        <a href="/catalog" class="active-tab">Каталог</a>
    </div>
</body>
</html>
