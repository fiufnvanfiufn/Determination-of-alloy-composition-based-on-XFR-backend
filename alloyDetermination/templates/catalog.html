<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <link rel="stylesheet" href="/styles/style.css">
</head>
<body class="mobile-body">
    <form action="/catalog" method="GET" class="filter-slider-container">
        <div class="slider-header">
            <span class="slider-title">Выбранная частота:</span>
            <span class="slider-current-val">
                {{ if .energy }}{{ .energy }} кэВ{{ else }}0 кэВ{{ end }}
            </span>
        </div>

        <input
            type="range"
            name="energy"
            min="0"
            max="25"
            step="0.01"
            value="{{ if .energy }}{{ .energy }}{{ else }}0{{ end }}"
            class="range-slider"
        >

        <div class="filter-actions">
            <button type="submit" class="filter-btn">Применить</button>
        </div>
    </form>

    <div class="grid">
        {{ range .alloys }}
        <div class="card">
            <a href="/feed?alloy_id={{ .ID }}">
                {{ if .ImgURL }}
                    <img src="{{ .ImgURL }}" alt="{{ .Name }}">
                {{ else }}
                    <img src="/img/default.png" alt="{{ .Name }}">
                {{ end }}
            </a>

            <div class="card-info">
                <a href="/feed?id={{ .ID }}" class="card-title">
                    {{ .Name }}
                </a>
                <div class="card-energy">
                    Частота: {{ .EnergyKev }} кэВ
                </div>
            </div>

            <div class="card-footer">
                <div class="card-heart">
                    {{ .LikesCount }} 🤍
                </div>

                <form action="/delete" method="POST">
                    <input type="hidden" name="alloy_id" value="{{ .ID }}">
                    <button type="submit" class="filter-btn filter-btn-small" title="Удалить">✕</button>
                </form>
            </div>
        </div>
        {{ end }}
    </div>

    <!-- Нижняя панель навигации -->
    <div class="tab-bar">
        <a href="/feed">Лента</a>
        <a href="/draft">Добавление</a>
        <a href="/catalog" class="active-tab">Каталог</a>
    </div>
</body>
</html>
